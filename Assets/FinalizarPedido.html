<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumen del Pedido | Herencia</title>

<link rel="icon" href="Favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<link rel="stylesheet" href="estilos.css">

<style>
a.logo { text-decoration: none; }
.checkout-container{
    max-width:800px;
    margin:120px auto;
    padding:40px;
}
.checkout-container, .checkout-container *{
    color:white!important;
}
.checkout-container h1{
    font-size:32px;
    margin-bottom:30px;
}
.checkout-total{
    margin-top:25px;
    font-size:22px;
    font-weight:bold;
}
h2{
    margin-top:45px;
    margin-bottom:20px;
}
.form-group{
    display:flex;
    flex-direction:column;
    margin-bottom:18px;
}
.form-group label{
    font-size:14px;
    margin-bottom:6px;
}
.form-group input{
    padding:12px;
    background:transparent;
    border:1px solid #444;
    font-size:14px;
}
.form-group input:focus{
    outline:none;
    border-color:white;
}
.form-row{
    display:flex;
    gap:20px;
}
.form-row .form-group{flex:1}

#checkoutLista{
    margin-bottom:20px;
}
.item-checkout{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    border-bottom:1px solid #333;
    padding-bottom:8px;
    font-size:14px;
}

.btn-primary{
    margin-top:30px;
    padding:15px;
    width:100%;
    border:none;
    background:white;
    color:black !important;
    font-weight:bold;
    cursor:pointer;
}
.btn-primary:hover{opacity:.85}

/* Responsive */
@media(max-width:768px){
    .checkout-container{
        margin:90px 20px;
        padding:30px 20px;
    }
    .checkout-container h1{font-size:26px}
    .form-row{flex-direction:column;gap:0}
}
@media(max-width:480px){
    .checkout-container{
        margin:80px 15px;
        padding:25px 15px;
    }
    .checkout-container h1{font-size:22px}
    .form-group input{padding:10px}
}
</style>
</head>

<body>

<header>
    <div class="menu-icon" id="menuBtn">
        <span></span><span></span><span></span>
    </div>
    <a href="../index.html" class="logo">Herencia</a>
    <a href="../index.html" class="cart-icon" title="Volver a la tienda">
        <span style="font-size:14px;">← Tienda</span>
    </a>
</header>

<nav id="menu">
    <a href="../index.html">Inicio</a>
    <a href="CategoriaH.html">Hombre</a>
    <a href="CategoriaM.html">Mujer</a>
</nav>

<form
  class="checkout-container"
  id="checkoutForm"
  action="https://formsubmit.co/colherencia@gmail.com"
  method="POST"
>


<input type="hidden" name="_subject" value="🛒 Nuevo pedido - Herencia">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="Total pedido" id="totalHidden">
<input type="hidden" name="Productos" id="productosHidden">

<h1>Resumen del Pedido</h1>

<div id="checkoutLista"></div>







<div class="checkout-total">
    Total: <span id="checkoutTotal">0</span> COP
</div>

<h2>Contacto</h2>
<div class="form-group">
    <label>Correo electrónico *</label>
    <input type="email" name="Correo" required>
</div>

<h2>Entrega</h2>
<div class="form-group">
    <label>País</label>
    <input type="text" value="Colombia" name="País" readonly>
</div>

<div class="form-row">
    <div class="form-group">
        <label>Nombre *</label>
        <input type="text" name="Nombre" required>
    </div>
    <div class="form-group">
        <label>Apellidos *</label>
        <input type="text" name="Apellidos" required>
    </div>
</div>

<div class="form-group">
    <label>Cédula *</label>
    <input type="text" name="Cédula" required>
</div>

<div class="form-group">
    <label>Dirección *</label>
    <input type="text" name="Dirección" required>
</div>

<div class="form-group">
    <label>Casa / Apto</label>
    <input type="text" name="Detalle dirección">
</div>

<div class="form-group">
    <label>Ciudad</label>
    <input type="text" value="Bogotá" name="Ciudad" readonly>
</div>

<div class="form-group">
    <label>Teléfono *</label>
    <input type="text" name="Teléfono" required>
</div>

<button type="submit" class="btn-primary">
    Pagar ahora
</button>

</form>

<script src="lenguaje.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    const lista = document.getElementById("checkoutLista");
    const totalEl = document.getElementById("checkoutTotal");
    const totalHidden = document.getElementById("totalHidden");
    const productosHidden = document.getElementById("productosHidden");

    if (carrito.length === 0) {
        lista.innerHTML = '<p style="opacity:0.8;">Tu carrito está vacío.</p>';
        totalEl.textContent = "0";
        totalHidden.value = "0 COP";
        productosHidden.value = "";
        document.querySelector(".btn-primary").disabled = true;
        return;
    }

    let total = 0;
    let productosTexto = "";

    lista.innerHTML = "";

    carrito.forEach(p => {
        const subtotal = p.precio * p.cantidad;
        total += subtotal;
        productosTexto += `${p.nombre} x${p.cantidad} - ${subtotal} COP | `;

        lista.innerHTML += `
            <div class="item-checkout">
                <span>${p.nombre} x${p.cantidad}</span>
                <span>${subtotal.toLocaleString("es-CO")} COP</span>
            </div>
        `;
    });

    totalEl.textContent = total.toLocaleString("es-CO");
    totalHidden.value = total + " COP";
    productosHidden.value = productosTexto;
});
</script>

</body>
</html>
