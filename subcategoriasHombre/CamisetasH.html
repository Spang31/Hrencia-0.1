<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camisetas Hombre | Herencia</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="../Assets/Favicon.png">

    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../Assets/estilos.css">
</head>

<body>

<header>
    <div class="menu-icon" id="menuBtn">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="logo">Herencia</div>

    <div class="cart-icon" id="cartBtn">
        <img src="../svg/Carrito.svg" alt="Carrito de compras">
        <span id="cartCount">0</span>
    </div>
</header>

<!-- MENÚ MÓVIL -->
<nav id="menu">
    <a href="../index.html">Inicio</a>
    <a href="../Assets/CategoriaH.html">Hombre</a>
    <a href="../Assets/CategoriaM.html">Mujer</a>
</nav>

<!-- MENÚ PC -->
<div class="menu-pc">
    <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="../Assets/CategoriaH.html">Hombre</a></li>
        <li><a href="../Assets/CategoriaM.html">Mujer</a></li>
    </ul>
</div>

<section class="catalogo">
    <h2 class="categoria-titulo">Camisetas</h2>



    <div class="categoria-grid">

        <!-- PRODUCTO 1 -->
        <div class="producto" data-name="Camiseta Inti" data-price="44000">
            <div class="slider">
                <img src="../Ropa/Camisetas/IntiD.png" class="active" alt="Camiseta Inti frontal">
                <img src="../Ropa/Camisetas/IntiT.png" alt="Camiseta Inti trasera">
            </div>
            <span>44.000 COP</span>
            <button class="add-to-cart">
                <img src="../svg/Añade.svg" alt="Agregar Camiseta Inti">
            </button>
        </div>

        <!-- PRODUCTO 2 -->
        <div class="producto" data-name="Camiseta Cóndor" data-price="37000">
            <div class="slider">
                <img src="../Ropa/Camisetas/CondorD.png" class="active" alt="Camiseta Cóndor frontal">
                <img src="../Ropa/Camisetas/CondorT.png" alt="Camiseta Cóndor trasera">
            </div>
            <span>37.000 COP</span>
            <button class="add-to-cart">
                <img src="../svg/Añade.svg" alt="Agregar Camiseta Cóndor">
            </button>
        </div>

        <!-- PRODUCTO 3 -->
        <div class="producto" data-name="Camiseta 6402" data-price="44000">
            <div class="slider">
                <img src="../Models/6402MD.png" class="active" alt="Camiseta 6402 frontal">
                <img src="../Ropa/Camisetas/6402D.png" alt="Camiseta 6402 detalle">
                <img src="../Ropa/Camisetas/6402T.png" alt="Camiseta 6402 trasera">
            </div>
            <span>44.000 COP</span>
            <button class="add-to-cart">
                <img src="../svg/Añade.svg" alt="Agregar Camiseta 6402">
            </button>
        </div>

        <!-- PRODUCTO 4 -->
        <div class="producto" data-name="Camiseta Maya" data-price="85000">
            <div class="slider">
                <img src="" class="active" alt="Camiseta Maya frontal">
                <img src="" alt="Camiseta Maya trasera">
                <img src="" alt="Camiseta Maya modelo">
            </div>
            <span>85.000 COP</span>
            <button class="add-to-cart">
                <img src="../svg/Añade.svg" alt="Agregar Camiseta Maya">
            </button>
        </div>

    </div>
</section>

<!-- SECCIÓN BOXY -->
<section class="catalogo">
    <h2 class="categoria-titulo">Boxy fit</h2>

    <div class="categoria-grid">

        <!-- PRODUCTO BOXY 1 -->
        <div class="producto" data-name="Camiseta Boxy Quimbaya" data-price="59900 ">
            <div class="slider">
                <img src="../Ropa/Camisetas/Quimbaya D.png" class="active" alt="Camiseta Boxy Quimbaya frontal">
                <img src="../Ropa/Camisetas/Quimbaya T.png" alt="Camiseta Boxy Quimbaya trasera">
            </div>
            <span>59.900 COP</span>
            <button class="add-to-cart">
                <img src="../svg/Añade.svg" alt="Agregar Camiseta Boxy Quimbaya">
            </button>
        </div>


        <div class="producto" data-name="Camiseta boxy Herencia" data-price="59900">
            <div class="slider">
                <img src="../Ropa/Camisetas/HD.png" class="active" alt="Herencia F">
                <img src="../Ropa/Camisetas/HT.png" alt="Camiseta Herencia T">
            </div>
            <span>59.900 COP</span>
            <button class="add-to-cart">
                <img src="../svg/Añade.svg" alt="Agregar Camiseta Boxy Quimbaya">
            </button>
        </div>




    </div>
</section>

<!-- PANEL CARRITO -->
<div id="panelCarrito" class="panel-carrito">
    <h2>Tu carrito</h2>

    <div id="listaCarrito" class="lista-carrito"></div>

    <div class="total">
        Total: <span id="totalCarrito">0</span> COP
    </div>

    <button id="cerrarCarrito" class="btn-cerrar">
        Cerrar menú
    </button>

    <a href="../Assets/FinalizarPedido.html">
        <button id="finalizarCompra">Finalizar Pedido</button>
    </a>
</div>

<script src="../Assets/lenguaje.js"></script>

</body>
</html>
