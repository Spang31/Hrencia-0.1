<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camisetas Hombre | Herencia</title>

    <!-- FAVICON -->
    <link rel="icon" href="../Assets/Favicon.png">

    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../Assets/estilos.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header>
    <div class="menu-icon" id="menuBtn">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="logo">Herencia</div>

    <div class="cart-icon" id="cartBtn">
        <img src="../svg/Carrito.svg" alt="Carrito de compras">
        <span id="cartCount">0</span>
    </div>
</header>

<!-- ================= MENÚ MÓVIL ================= -->
<nav id="menu">
    <a href="../index.html">Inicio</a>
    <a href="../Assets/CategoriaH.html">Hombre</a>
    <a href="../Assets/CategoriaM.html">Mujer</a>
</nav>

<!-- ================= MENÚ PC ================= -->
<div class="menu-pc">
    <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="../Assets/CategoriaH.html">Hombre</a></li>
        <li><a href="../Assets/CategoriaM.html">Mujer</a></li>
    </ul>
</div>

<!-- ================= CATÁLOGO ================= -->
<section class="catalogo">

    <h2 class="categoria-titulo">Camisetas</h2>

    <div class="categoria-grid">

        <!-- PRODUCTO 1 -->
        <div class="producto"
             data-name="Camiseta Inti"
             data-price="44000">

            <div class="slider">
                <img src="../Ropa/IntiD.jpg" class="active" alt="Camiseta Inti vista frontal">
                <img src="../Ropa/Camisetas/IntiD.png" alt="Camiseta Inti detalle diseño">
                <img src="../Ropa/Camisetas/IntiT.png" alt="Camiseta Inti vista trasera">
            </div>

            <span>44.000 COP</span>

            <button class="add-to-cart">
                <img src="../svg/Añade.svg" alt="Agregar Camiseta Inti al carrito">
            </button>

        </div>

        <!-- PRODUCTO 2 -->
        <div class="producto"
             data-name="Camiseta Cóndor"
             data-price="44000">

            <div class="slider">
                <img src="../Ropa/Condor.png" class="active" alt="Camiseta Cóndor vista frontal">
                <img src="../Ropa/Camisetas/CondorD.png" alt="Camiseta Cóndor detalle diseño">
                <img src="../Ropa/Camisetas/CondorT.png" alt="Camiseta Cóndor vista trasera">
            </div>

            <span>44.000 COP</span>

            <button class="add-to-cart">
                <img src="../svg/Añade.svg" alt="Agregar Camiseta Cóndor al carrito">
            </button>

        </div>

        <!-- PRODUCTO 3 -->
        <div class="producto"
             data-name="Camiseta 6402"
             data-price="85000">

            <div class="slider">
                <img src="../Models/6402MD.png" class="active" alt="Camiseta 6402 vista frontal">
                <img src="../Ropa/Camisetas/6402D.png" alt="Camiseta 6402 detalle diseño">
                <img src="../Ropa/Camisetas/6402T.png" alt="Camiseta 6402 vista trasera">
            </div>

            <span>85.000 COP</span>

            <button class="add-to-cart">
                <img src="../svg/Añade.svg" alt="Agregar Camiseta 6402 al carrito">
            </button>

        </div>

        <!-- PRODUCTO 4 -->
        <div class="producto"
             data-name="Camiseta Maya"
             data-price="85000">

            <div class="slider">
                <img src="../Ropa/Maya-frente.jpg" class="active" alt="Camiseta Maya vista frontal">
                <img src="../Ropa/Maya-atras.jpg" alt="Camiseta Maya vista trasera">
                <img src="../Ropa/Maya-modelo.jpg" alt="Camiseta Maya en modelo">
            </div>

            <span>85.000 COP</span>

            <button class="add-to-cart">
                <img src="../svg/Añade.svg" alt="Agregar Camiseta Maya al carrito">
            </button>

        </div>

    </div>

</section>

<!-- ================= PANEL CARRITO ================= -->
<div id="panelCarrito" class="panel-carrito">
    <h2>Tu carrito</h2>

    <div id="listaCarrito" class="lista-carrito"></div>

    <div class="total">
        Total: <span id="totalCarrito">0</span> COP
    </div>

    <button id="cerrarCarrito" class="btn-cerrar">
        Cerrar menú
    </button>

    <a href="../Assets/FinalizarPedido.html">
        <button id="finalizarCompra">
            Finalizar Pedido
        </button>   
    </a>

</div>

<!-- ================= JS ================= -->
<script src="../Assets/lenguaje.js"></script>

</body>
</html>
